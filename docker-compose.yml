services:
  backend:
    build: ./backend
    container_name: meal-ticket-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    stdin_open: true
    tty: true

  frontend:
    build: ./frontend
    container_name: meal-ticket-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    stdin_open: true
    tty: true

  dev-kitchen:
    image: postgres:15
    container_name: dev-kitchen
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: