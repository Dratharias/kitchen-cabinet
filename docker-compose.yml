services:
  backend:
    build: ./backend
    container_name: meal-ticket-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app:Z
      - backend_node_modules:/app/node_modules
      - /app/dist
      - ./images:/app/public/images:Z
    env_file:
      - ./backend/.env
    stdin_open: true
    tty: true
    depends_on:
      - dev-kitchen
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build: ./frontend
    container_name: meal-ticket-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    stdin_open: true
    tty: true
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  ai-service:
    build: ./ai-service
    container_name: meal-ticket-ai-service
    ports:
      - "3002:3002"
    volumes:
      - ./ai-service:/app:Z
      - ai_service_node_modules:/app/node_modules
      - ./instructions:/app/instructions:Z
    env_file:
      - ./ai-service/.env
    stdin_open: true
    tty: true
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  dev-kitchen:
    image: postgres:16-alpine
    container_name: dev-kitchen
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro,Z
      - pgdata:/var/lib/postgresql/data:Z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    shm_size: 128M

volumes:
  pgdata:
  frontend_node_modules:
  backend_node_modules:
  ai_service_node_modules:
