services:
  backend:
    build: ./backend
    container_name: meal-ticket-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app:Z
      - /app/node_modules
    env_file:
      - ./backend/.env
    stdin_open: true
    tty: true
    depends_on:
      - dev-kitchen

  frontend:
    build: ./frontend
    container_name: meal-ticket-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    env_file:
      - ./frontend/.env
    stdin_open: true
    tty: true
    depends_on:
      - backend

  dev-kitchen:
    image: postgres:latest
    container_name: dev-kitchen
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro,Z
      - pgdata:/var/lib/postgresql/data:Z
    restart: unless-stopped

volumes:
  pgdata:
